services:
  authz-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      AUTHZ_DATABASE_PATH: /var/lib/authz/authz-web.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - authz-data:/var/lib/authz
    restart: unless-stopped

volumes:
  authz-data:
